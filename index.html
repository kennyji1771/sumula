<style>
:root{--bg:#f4f7fc;--surface:#fff;--text:#212529;--text-secondary:#6c757d;--header-bg:linear-gradient(135deg,#1a2a4a,#2c3e6b);--header-text:white;--border-light:#dee2e6;--editor-bg:#fafbfc;--nodo-bg:white;--nodo-hover-bg:#f8faff;--scrollbar-thumb:#c1c9d2;--modal-overlay:rgba(0,0,0,.5);--level-0-bg:#fef5e7;--level-0-border:#e67e22;--level-1-border:#3498db;--level-2-border:#2ecc71;--level-3-border:#9b59b6;--level-4-border:#e74c3c;--highlight-bg:#ffeb3b;--highlight-text:#000}
body.dark-theme{--bg:#1e1e2e;--surface:#2a2a3c;--text:#e0e0e0;--text-secondary:#a0a0b0;--border-light:#3a3a4c;--editor-bg:#2a2a3c;--nodo-bg:#2a2a3c;--nodo-hover-bg:#35355a;--level-0-bg:#3d2e1c;--level-0-border:#f0a04b;--highlight-bg:#b8860b;--highlight-text:#fff}
*{transition:background-color .25s,color .25s}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,system-ui,sans-serif;margin:0;min-height:100vh}
.app-header{background:var(--header-bg);color:var(--header-text);padding:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:1050}
.brand-wrapper{display:flex;align-items:center;gap:10px}
.logo-img{max-height:36px;max-width:120px;object-fit:contain;border-radius:6px}
.brand-name{font-weight:700;font-size:1.5rem;letter-spacing:-.5px}
.subtitle{font-size:.9rem;opacity:.8}
.toolbar-acciones{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border-radius:30px;padding:5px 14px;font-weight:500;font-size:.85rem;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.15);border:none;color:inherit}
.btn-light{background:#f8f9fa;color:#212529}
.btn-outline-light{background:transparent;border:1px solid rgba(255,255,255,.5);color:white}
.btn-outline-light:hover{background:rgba(255,255,255,.2)}
.editor-area,.mapa-area{background:var(--surface);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:16px;height:calc(100vh - 180px);display:flex;flex-direction:column;overflow:hidden;position:relative}
.editor-area textarea{flex:1;border:none;resize:none;font-family:'Fira Code','Courier New',monospace;font-size:14px;line-height:1.7;padding:12px;background:var(--editor-bg);color:var(--text);border-radius:12px;outline:none}
.mapa-area{overflow:hidden}
.mapa-scroll{flex:1;overflow-y:auto}
.mapa-scroll::-webkit-scrollbar{width:6px}
.mapa-scroll::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
.card-nodo{border-left:5px solid;border-radius:12px;padding:10px 16px;margin-bottom:10px;cursor:pointer;transition:transform .15s,background .2s;box-shadow:0 1px 4px rgba(0,0,0,.04);background:var(--nodo-bg);position:relative}
.card-nodo:hover{transform:translateX(4px);background:var(--nodo-hover-bg)}
.level-0{border-left-color:var(--level-0-border);background:var(--level-0-bg)}
.level-1{border-left-color:var(--level-1-border)}
.level-2{border-left-color:var(--level-2-border)}
.level-3{border-left-color:var(--level-3-border)}
.level-4{border-left-color:var(--level-4-border)}
.nodo-titulo{font-weight:600;display:flex;justify-content:space-between;align-items:center}
.nodo-hijos{margin-left:28px;padding-left:16px;border-left:2px dashed var(--border-light);margin-top:8px}
.collapsed{display:none}
.icono-toggle{font-size:.9rem;opacity:.6;margin-left:12px;transition:.2s}
.btn-fullscreen{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.1);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;color:var(--text-secondary)}
.fullscreen-panel{position:fixed!important;top:0;left:0;width:100vw!important;height:100vh!important;z-index:2000;border-radius:0!important;padding:20px!important}
.search-box{display:flex;align-items:center;background:var(--surface);border-radius:20px;padding:4px 8px;border:1px solid var(--border-light);margin-bottom:8px;gap:4px}
.search-box input{border:none;background:transparent;outline:none;width:100%;padding:4px 8px;color:var(--text)}
.reader-panel{background:var(--surface);border-radius:12px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border-light)}
.dropdown{position:relative;display:inline-block}
.dropdown-menu{display:none;position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;min-width:220px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:1000;padding:8px 0}
.dropdown-menu.show{display:block}
.dropdown-item{display:block;padding:8px 16px;color:var(--text);text-decoration:none;cursor:pointer;white-space:nowrap}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:3000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-content{background:var(--surface);border-radius:16px;max-width:500px;width:90%;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
select.form-select,input.form-control{background:var(--surface);color:var(--text);border:1px solid var(--border-light);border-radius:20px}
.node-select{margin-right:8px;transform:scale(1.2);cursor:pointer}
.highlight-word{background:var(--highlight-bg);color:var(--highlight-text);border-radius:3px;font-weight:bold}
.btn-sumula-accion{background:#ffcd3c;color:#212529;border:none;border-radius:30px;padding:5px 14px;font-weight:700;cursor:pointer;margin-top:10px}
.recording-dot{color:red;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.timer-display{font-family:monospace;font-weight:bold;font-size:.9rem}
.speed-pitch{display:flex;flex-direction:column;gap:2px}
.speed-pitch label{font-size:.7rem;color:var(--text-secondary)}
.btn-karaoke{background:#3498db;color:white}
.btn-karaoke:hover{background:#2980b9}
.btn-karaoke.active{background:#2980b9;box-shadow:inset 0 0 0 3px #fff}
.btn-continue{background:#16a085;color:white;font-size:.8rem;padding:5px 10px}
.btn-continue:hover{background:#13876f}
#karaokeModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--surface);z-index:5000;flex-direction:column}
#karaokeModal.show{display:flex}
#karaokeHeader{background:var(--header-bg);color:white;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
#karaokeHeader h3{margin:0;font-size:1.1rem;color:white}
#karaokeHeader .kc{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#karaokeHeader button{border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;font-weight:bold;color:white}
#karaokeHeader button:hover{filter:brightness(1.15)}
#karaokeBody{flex:1;overflow-y:auto;padding:30px 50px;font-size:1.7rem;line-height:2.1;color:var(--text);background:var(--editor-bg)}
.kw{padding:2px 4px;border-radius:4px;transition:background .15s,color .15s;cursor:text}
.kw.hl{background:var(--highlight-bg);color:var(--highlight-text);font-weight:bold;box-shadow:0 0 8px rgba(255,235,59,.6)}
.knt{font-size:1.1rem;color:#3498db;font-weight:600;margin-bottom:14px;padding-bottom:6px;border-bottom:2px solid var(--border-light)}
#capturasPanel{background:#f0f5fa;border-top:2px solid #3498db;max-height:38vh;overflow-y:auto;display:flex;flex-direction:column}
body.dark-theme #capturasPanel{background:#252535}
#capturasHeader{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:#e3ecf5;border-bottom:1px solid #d0dde8;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:10}
body.dark-theme #capturasHeader{background:#1a1a28;border-bottom-color:#3a3a4c}
#capturasHeader span{font-weight:bold;font-size:13px;color:#1a2a4a}
body.dark-theme #capturasHeader span{color:#6ab0ff}
#capturasHeader button{border:none;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;font-weight:bold;background:#3498db;color:white}
#capturasHeader button.danger{background:#e74c3c}
#capturasHeader button:hover{filter:brightness(1.1)}
#capturasList{padding:6px 14px;display:flex;flex-direction:column;gap:6px}
.cap-item{background:white;border-left:4px solid #e67e22;border-radius:6px;padding:6px 10px;font-size:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
body.dark-theme .cap-item{background:#2a2a3c;color:#e0e0e0}
.cap-text{flex:1;line-height:1.4;font-family:monospace;font-size:11px;word-break:break-word}
.cap-acc{display:flex;gap:3px}
.cap-acc button{border:none;background:#f0f0f0;border-radius:4px;padding:2px 6px;cursor:pointer;font-size:10px}
body.dark-theme .cap-acc button{background:#3a3a4c;color:#ccc}
.cap-vacio{color:#999;text-align:center;padding:16px;font-style:italic;font-size:11px}
</style>
</head>
<body>
<div class="app-header">
<div class="container">
<div class="row align-items-center">
<div class="col-md-5">
<div class="brand-wrapper">
<img id="logoImg" class="logo-img" src="" alt="Logo" style="display:none;">
<i id="defaultBrain" class="fas fa-brain fa-2x" style="color:#ffcd3c;"></i>
<div>
<div class="brand-name">Nexus <span style="color:#ffcd3c;">Acelerador</span></div>
<div class="subtitle" id="tituloDinamico">Centro de Conocimiento</div>
</div>
</div>
</div>
<div class="col-md-7 toolbar-acciones justify-content-end mt-2 mt-md-0">
<button class="btn btn-outline-light" id="btnSumula">SÚMULA</button>
<button class="btn btn-outline-light" id="btnCorolario">Corolario</button>
<button class="btn btn-outline-light" id="btnConfig"><i class="fas fa-cog"></i></button>
<button class="btn btn-outline-light" id="btnAPA"><i class="fas fa-id-card"></i> APA</button>
<div class="dropdown">
<button class="btn btn-light dropdown-toggle" id="dropdownBtn">Acciones</button>
<div class="dropdown-menu" id="dropdownMenu">
<a class="dropdown-item" id="exportarHtml"><i class="fas fa-file-code me-2"></i>Exportar HTML</a>
<a class="dropdown-item" id="vistaPreviaHtml"><i class="fas fa-eye me-2"></i>Vista previa HTML</a>
<hr style="border:none;border-top:1px solid var(--border-light);margin:4px 0">
<a class="dropdown-item" id="exportarTree"><i class="fas fa-tree me-2"></i>Exportar Árbol TXT</a>
<a class="dropdown-item" id="exportarTxt"><i class="fas fa-file-alt me-2"></i>Exportar TXT Raw</a>
<a class="dropdown-item" id="exportarMd"><i class="fab fa-markdown me-2"></i>Exportar Markdown</a>
<a class="dropdown-item" id="exportarTxtEnriquecido"><i class="fas fa-book-open me-2"></i>Exportar TXT Enriquecido</a>
</div>
</div>
<button class="btn btn-light" id="expandirTodo"><i class="fas fa-expand-alt"></i></button>
<button class="btn btn-light" id="colapsarTodo"><i class="fas fa-compress-alt"></i></button>
<button class="btn btn-light" id="btnUndo"><i class="fas fa-undo"></i></button>
<button class="btn btn-light" id="btnRedo"><i class="fas fa-redo"></i></button>
<button class="btn btn-outline-light" id="btnTheme"><i class="fas fa-moon"></i></button>
</div>
</div>
</div>
</div>

<div class="container mt-3">
<div class="row g-3">
<div class="col-lg-6" id="panelEditor">
<div class="editor-area">
<button class="btn-fullscreen" data-target="panelEditor"><i class="fas fa-expand"></i></button>
<textarea id="contenido" spellcheck="false"></textarea>
</div>
</div>
<div class="col-lg-6" id="panelMapa">
<div class="mapa-area">
<button class="btn-fullscreen" data-target="panelMapa"><i class="fas fa-expand"></i></button>
<div class="search-box">
<i class="fas fa-search text-secondary"></i>
<input type="text" id="searchInput" placeholder="Buscar en mapa...">
<button id="clearSearch" style="border:none;background:transparent;cursor:pointer;"><i class="fas fa-times"></i></button>
</div>
<div class="reader-panel" id="readerPanel">
<button class="btn btn-sm btn-primary" id="btnPlayPause" title="Reproducir/Pausar">▶</button>
<button class="btn btn-sm btn-warning" id="btnPause" title="Pausar" style="display:none;">⏸</button>
<button class="btn btn-sm btn-secondary" id="btnStop" title="Detener">⏹</button>
<button class="btn btn-sm btn-warning" id="btnLoop" title="Repetir en bucle">🔁</button>
<button class="btn btn-sm btn-karaoke" id="btnKaraoke" title="Lectura Asistida">📖</button>
<button class="btn btn-sm btn-continue" id="btnContinuar" title="Continuar sin filtro" style="display:none;">▶▶ Continuar</button>
<button class="btn btn-sm btn-danger" id="btnRec" title="Grabar"><i class="fas fa-circle"></i></button>
<button class="btn btn-sm btn-info" id="btnTimer" title="Cronómetro">⏱</button>
<div class="speed-pitch"><label>Velocidad</label><input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="0.9"></div>
<div class="speed-pitch"><label>Tono</label><input type="range" id="pitchRange" min="0.5" max="1.5" step="0.1" value="1"></div>
<select class="form-select form-select-sm" id="voiceSelect" style="width:auto;"></select>
<span id="currentReading" class="text-muted small">Listo</span>
<span id="timerDisplay" class="timer-display">00:00</span>
<span id="estimatedTime" class="text-muted small"></span>
</div>
<div class="mapa-scroll" id="mapaScroll"><div id="mapa"></div></div>
</div>
</div>
</div>
</div>

<div class="modal-overlay" id="sumulaModal">
<div class="modal-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h5 style="margin:0;">Importar a SÚMULA</h5><button id="closeSumulaModal" style="border:none;background:none;font-size:1.4rem;cursor:pointer;">&times;</button></div>
<div class="mb-3"><label>Archivo (PDF, DOCX, TXT, HTML)</label><input type="file" class="form-control" id="fileSumulaInput" accept=".pdf,.docx,.txt,.html,.htm"></div>
<div class="text-center my-2">- O -</div>
<div class="mb-3"><label>Pegar texto</label><textarea class="form-control" id="pastedTextSumula" rows="4"></textarea></div>
<div style="display:flex;justify-content:space-between;"><button class="btn btn-secondary" id="cancelSumula">Cancelar</button><button class="btn-sumula-accion" id="processSumula">Procesar</button></div>
<div id="sumulaLoading" style="text-align:center;margin-top:8px;display:none;"><i class="fas fa-spinner fa-spin"></i> Procesando...</div>
</div>
</div>

<div class="modal-overlay" id="configModal">
<div class="modal-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h5 style="margin:0;">Configuración</h5><button class="btn-close" id="closeConfigModal" style="border:none;background:none;font-size:1.4rem;cursor:pointer;">&times;</button></div>
<div class="mb-3"><label>Logo (URL o ruta)</label><input type="text" class="form-control" id="logoFilename"></div>
<button class="btn btn-primary" id="saveConfig">Guardar</button>
</div>
</div>

<div class="modal-overlay" id="apaModal">
<div class="modal-content">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h5 style="margin:0;">Datos APA</h5><button class="btn-close" id="closeApaModal" style="border:none;background:none;font-size:1.4rem;cursor:pointer;">&times;</button></div>
<div class="mb-3"><label>Autor</label><input type="text" class="form-control" id="apaAuthor"></div>
<div class="mb-3"><label>Título</label><input type="text" class="form-control" id="apaTitle"></div>
<div class="mb-3"><label>Institución</label><input type="text" class="form-control" id="apaInstitution"></div>
<div class="mb-3"><label>Fecha</label><input type="date" class="form-control" id="apaDate"></div>
<button class="btn btn-primary w-100" id="saveAPA">Guardar</button>
</div>
</div>

<div id="karaokeModal">
<div id="karaokeHeader">
<h3>📖 Lectura Asistida</h3>
<div class="kc">
<button style="background:#2ecc71" id="kPlay">▶</button>
<button style="background:#f39c12" id="kPause">⏸</button>
<button style="background:#e74c3c" id="kStop">⏹</button>
<button style="background:#7f8c8d" id="kPrev" title="Anterior">⏮</button>
<button style="background:#7f8c8d" id="kNext" title="Siguiente">⏭</button>
<button style="background:#f39c12" id="kRepeat" title="Repetir actual una vez">🔂1</button>
<button style="background:#8e44ad" id="kLoopInf" title="Repetir todo en bucle hasta detener">🔄∞</button>
<button style="background:#e67e22" id="kCapture" title="Capturar selección">⭐ Capturar</button>
<button style="background:#8e44ad" id="kLoopCap" title="Repetir capturas">🎯 Bucle Cap.</button>
<button style="background:#e74c3c" id="kClose">✕ Cerrar</button>
</div>
</div>
<div id="karaokeBody"></div>
<div id="capturasPanel">
<div id="capturasHeader">
<span>📋 Capturas (<span id="capturasCount">0</span>)</span>
<div style="display:flex;gap:5px;flex-wrap:wrap">
<button id="capDownload">📥 .txt</button>
<button id="capCopy">📋 Copiar</button>
<button id="capClear" class="danger">🗑</button>
</div>
</div>
<div id="capturasList"></div>
</div>
</div>

<div class="footer" style="text-align:center;padding:8px;font-size:.8rem;color:var(--text-secondary);">
<i class="fas fa-bolt text-warning"></i> Acelera tus ideas
</div>

.level-2{border-left-color:#2ecc71}
.level-3{border-left-color:#9b59b6}
.level-4{border-left-color:#e74c3c}
.nodo-titulo{font-weight:600;display:flex;justify-content:flex-start;align-items:center;font-size:14px;gap:10px}
.nodo-titulo .titulo-txt{flex:1;line-height:1.4}
.nodo-chk{width:18px;height:18px;cursor:pointer;accent-color:#3498db;flex-shrink:0;margin:0}
.nodo-hijos{margin-left:24px;padding-left:14px;border-left:2px dashed var(--border);margin-top:6px}
.collapsed{display:none}
.icono-toggle{font-size:.85rem;opacity:.6;margin-left:10px;user-select:none;flex-shrink:0}
#karaokeModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--surface);z-index:5000;flex-direction:column}
#karaokeModal.show{display:flex}
#karaokeHeader{background:linear-gradient(135deg,#1a2a4a,#2c3e6b);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
#karaokeHeader h3{margin:0;font-size:1.1rem;color:#fff}
#karaokeHeader .kc{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
#karaokeHeader button{border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;font-weight:bold;color:#fff}
#karaokeBody{flex:1;overflow-y:auto;padding:30px 50px;font-size:1.7rem;line-height:2.1;color:var(--text);background:var(--editor-bg)}
.kw{padding:2px 4px;border-radius:4px;transition:background .15s,color .15s}
.kw.hl{background:var(--highlight);color:var(--highlight-text);font-weight:bold;box-shadow:0 0 8px rgba(255,235,59,.6)}
.knt{font-size:1.1rem;color:#3498db;font-weight:600;margin-bottom:14px;padding-bottom:6px;border-bottom:2px solid var(--border)}
#capturasPanel{background:var(--editor-bg);border-top:2px solid #3498db;max-height:38vh;overflow-y:auto;display:flex;flex-direction:column}
#capturasHeader{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px}
#capturasHeader span{font-weight:bold;font-size:13px;color:var(--text)}
#capturasHeader button{border:none;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:11px;font-weight:bold;background:#3498db;color:#fff}
#capturasHeader button.danger{background:#e74c3c}
#capturasList{padding:6px 14px;display:flex;flex-direction:column;gap:6px}
.cap-item{background:var(--surface);border-left:4px solid #e67e22;border-radius:6px;padding:6px 10px;font-size:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cap-text{flex:1;line-height:1.4;font-family:monospace;font-size:11px;word-break:break-word}
.cap-acc{display:flex;gap:3px}
.cap-acc button{border:none;background:var(--editor-bg);border-radius:4px;padding:2px 6px;cursor:pointer;font-size:10px;color:var(--text)}
.cap-vacio{color:var(--text-sec);text-align:center;padding:16px;font-style:italic;font-size:11px}
@media(max-width:768px){body{padding:10px}.toolbar button{padding:6px 10px;font-size:13px}h1{font-size:1.2rem}#karaokeBody{padding:16px 20px;font-size:1.3rem}}
</style>
</head>
<body>
<h1>__SUMMULA_TITLE__</h1>

<div class="toolbar">
  <button class="btn-play" id="btnPlay" title="Play/Pausa (Espacio)">▶</button>
  <button class="btn-stop" id="btnStop" title="Detener">⏹</button>
  <button class="btn-loop" id="btnLoop" title="Repetir todo">🔁</button>
  <button class="btn-karaoke" id="btnKaraoke" title="Lectura Asistida (K)">📖</button>
  <select id="voiceSelect" title="Voz"></select>
  <span class="timer" id="timerDisplay">00:00</span>
  <span class="status" id="status">Listo</span>
</div>

<div class="toolbar">
  <button class="btn-accion" id="btnExpandir" title="Expandir todo (E)">⊞ Expandir</button>
  <button class="btn-accion" id="btnColapsar" title="Colapsar todo (C)">⊟ Colapsar</button>
  <select id="collapseLevel" title="Colapsar a nivel">
    <option value="">Colapsar a nivel…</option>
    <option value="0">Solo nivel 1</option>
    <option value="1">Hasta nivel 2</option>
    <option value="2">Hasta nivel 3</option>
    <option value="3">Hasta nivel 4</option>
  </select>
  <button class="btn-accion" id="btnTheme" title="Modo oscuro (T)">🌙 Oscuro</button>
  <button class="btn-accion peligro" id="btnClearSel" title="Limpiar selección">✕ Limpiar</button>
  <span class="progress-badge" id="progressInfo">Todos los nodos</span>
  <span class="progress-badge" id="estimatedTime"></span>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Buscar…">
  <button id="clearSearch">✕</button>
</div>

<div id="mapa"></div>

<div id="karaokeModal">
  <div id="karaokeHeader">
    <h3>📖 Lectura Asistida</h3>
    <div class="kc">
      <button style="background:#2ecc71" id="kPlay">▶</button>
      <button style="background:#f39c12" id="kPause">⏸</button>
      <button style="background:#e74c3c" id="kStop">⏹</button>
      <button style="background:#7f8c8d" id="kPrev">⏮</button>
      <button style="background:#7f8c8d" id="kNext">⏭</button>
      <button style="background:#f39c12" id="kRepeat">🔂1</button>
      <button style="background:#8e44ad" id="kLoopInf">🔄∞</button>
      <button style="background:#e67e22" id="kCapture">⭐ Capturar</button>
      <button style="background:#8e44ad" id="kLoopCap">🎯 Bucle Cap.</button>
      <button style="background:#e74c3c" id="kClose">✕ Cerrar</button>
    </div>
  </div>
  <div id="karaokeBody"></div>
  <div id="capturasPanel">
    <div id="capturasHeader">
      <span>📋 Capturas (<span id="capturasCount">0</span>)</span>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button id="capDownload">📥 .txt</button>
        <button id="capCopy">📋 Copiar</button>
        <button class="danger" id="capClear">🗑</button>
      </div>
    </div>
    <div id="capturasList"></div>
  </div>
</div>

<script>var raw = __SUMMULA_CONTENT__;</script>
<script>
(function(){
'use strict';
var synth=window.speechSynthesis;
var utterance=null,estado='detenido';
var bucleActivo=false,bucleInfinito=false,bucleCapturas=false;
var cronoInterval=null,cronoSegundos=0,cronoInicioTramo=0;
var generacion=0,karaokeActivo=false;
var karaokeWords=[],karaokePositions=[],karaokeCurrentIdx=-1;
var capturas=[];
var wakeLock=null,silentCtx=null,silentOsc=null;
var listaNodos=[],indiceActual=0,parsed=null;

var slug=(document.title||'doc').replace(/[^a-z0-9]/gi,'_').substring(0,40);
var K={theme:'nx_'+slug+'_th',sel:'nx_'+slug+'_sel',coll:'nx_'+slug+'_col',voice:'nx_'+slug+'_vo',rate:'nx_'+slug+'_ra',pitch:'nx_'+slug+'_pi',caps:'nx_'+slug+'_cp'};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function loadSet(k){try{var v=JSON.parse(lsGet(k,'[]'));return new Set(Array.isArray(v)?v.map(String):[]);}catch(e){return new Set();}}
function saveSet(k,s){lsSet(k,JSON.stringify(Array.from(s)));}

var selectedIds=loadSet(K.sel);
var collapsedIds=loadSet(K.coll);
try{var c=lsGet(K.caps,'[]');capturas=JSON.parse(c)||[];}catch(e){capturas=[];}

function $(id){return document.getElementById(id);}
var btnPlay=$('btnPlay'),btnStop=$('btnStop'),btnLoop=$('btnLoop'),btnKaraoke=$('btnKaraoke'),
    voiceSelect=$('voiceSelect'),statusEl=$('status'),timerDisplay=$('timerDisplay'),
    mapaDiv=$('mapa'),progressInfo=$('progressInfo'),estimatedTime=$('estimatedTime'),
    btnExpandir=$('btnExpandir'),btnColapsar=$('btnColapsar'),collapseLevel=$('collapseLevel'),
    btnTheme=$('btnTheme'),btnClearSel=$('btnClearSel'),
    searchInput=$('searchInput'),clearSearch=$('clearSearch'),
    karaokeModal=$('karaokeModal'),karaokeBody=$('karaokeBody'),
    kPlay=$('kPlay'),kPause=$('kPause'),kStop=$('kStop'),kPrev=$('kPrev'),kNext=$('kNext'),
    kRepeat=$('kRepeat'),kLoopInf=$('kLoopInf'),kCapture=$('kCapture'),kLoopCap=$('kLoopCap'),kClose=$('kClose'),
    capturasCount=$('capturasCount'),capturasList=$('capturasList'),
    capDownload=$('capDownload'),capCopy=$('capCopy'),capClear=$('capClear');

async function activarMantenimiento(){
  if('wakeLock' in navigator){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
  if(!silentCtx){try{var C=window.AudioContext||window.webkitAudioContext;silentCtx=new C();silentOsc=silentCtx.createOscillator();var g=silentCtx.createGain();g.gain.value=0.0001;silentOsc.frequency.value=20000;silentOsc.connect(g);g.connect(silentCtx.destination);silentOsc.start();}catch(e){}}
}
function liberarMantenimiento(){
  if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}
  if(silentOsc){try{silentOsc.stop();}catch(e){}silentOsc=null;}
  if(silentCtx){try{silentCtx.close();}catch(e){}silentCtx=null;}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&estado==='leyendo')activarMantenimiento();});

function parsear(texto){
  var lineas=texto.split(/\r?\n/),nodos=[],pila=[],id=1;
  for(var i=0;i<lineas.length;i++){
    var a=lineas[i].trim();if(!a)continue;
    var v=-1,e=a;
    if(a.indexOf('# ')===0){v=0;e=a.slice(2);}
    else if(a.indexOf('## ')===0){v=1;e=a.slice(3);}
    else if(a.indexOf('### ')===0){v=2;e=a.slice(4);}
    else if(a.indexOf('#### ')===0){v=3;e=a.slice(5);}
    else if(a.indexOf('- ')===0||a.indexOf('* ')===0){v=pila.length?pila[pila.length-1].v+1:1;e=a.slice(2);}
    else{v=pila.length?pila[pila.length-1].v+1:1;e=a;}
    while(pila.length&&pila[pila.length-1].v>=v)pila.pop();
    var pid=pila.length?pila[pila.length-1].id:null;
    nodos.push({id:id,e:e,v:v,p:pid});
    pila.push({id:id,v:v});id++;
  }
  var hijosMap=new Map(),byId=new Map();
  nodos.forEach(function(n){hijosMap.set(n.id,[]);byId.set(n.id,n);});
  nodos.forEach(function(n){if(n.p!==null)hijosMap.get(n.p).push(n.id);});
  return {nodos:nodos,hijosMap:hijosMap,byId:byId,raices:nodos.filter(function(n){return n.p===null;})};
}
function addSubtree(id){selectedIds.add(String(id));(parsed.hijosMap.get(id)||[]).forEach(addSubtree);}
function removeSubtree(id){selectedIds.delete(String(id));(parsed.hijosMap.get(id)||[]).forEach(removeSubtree);}
function syncCheckbox(cb,id){
  var children=parsed.hijosMap.get(id)||[];var isSel=selectedIds.has(String(id));
  if(!children.length){cb.checked=isSel;cb.indeterminate=false;return;}
  var anyChild=children.some(function(c){return selectedIds.has(String(c));});
  if(isSel){cb.checked=true;cb.indeterminate=false;}
  else if(anyChild){cb.checked=false;cb.indeterminate=true;}
  else{cb.checked=false;cb.indeterminate=false;}
}
function updateAllCheckboxes(){document.querySelectorAll('.nodo-chk').forEach(function(cb){syncCheckbox(cb,parseInt(cb.dataset.id));});}
function buildReadingList(){
  if(!parsed)return[];
  if(selectedIds.size===0)return parsed.nodos.map(function(n){return n.e;});
  return parsed.nodos.filter(function(n){return selectedIds.has(String(n.id));}).map(function(n){return n.e;});
}
function actualizarTiempoEstimado(){
  var texto=buildReadingList().join(' ');
  var palabras=texto.trim().split(/\s+/).filter(function(x){return x;}).length;
  var rate=parseFloat(lsGet(K.rate,'0.9'))||0.9;
  var seg=Math.round((palabras/175*60)/rate);
  estimatedTime.textContent='~'+Math.floor(seg/60)+'m '+String(seg%60).padStart(2,'0')+'s ('+palabras+' pal.)';
}
function updateProgress(){
  var n=selectedIds.size;
  if(n===0){progressInfo.textContent='Todos los nodos';progressInfo.classList.remove('ok');}
  else{progressInfo.textContent=n+' seleccionado'+(n===1?'':'s');progressInfo.classList.add('ok');}
  actualizarTiempoEstimado();
}
function render(searchTerm){
  try{
    parsed=parsear(raw);
    var term=(searchTerm||'').toLowerCase().trim();
    mapaDiv.innerHTML='';
    if(!parsed.raices.length){
      mapaDiv.innerHTML='<div style="text-align:center;color:var(--text-sec);padding:40px">Sin estructura Súmula detectada. Usa <code># Título</code>.</div>';
      updateProgress();return;
    }
    var cont=document.createElement('div');
    function construir(id){
      var n=parsed.byId.get(id);if(!n)return null;
      var hijos=parsed.hijosMap.get(id)||[];
      var card=document.createElement('div');
      card.className='card-nodo level-'+Math.min(n.v,4);card.dataset.id=id;
      var td=document.createElement('div');td.className='nodo-titulo';
      var chk=document.createElement('input');
      chk.type='checkbox';chk.className='nodo-chk';chk.dataset.id=id;
      syncCheckbox(chk,id);
      chk.addEventListener('click',function(e){e.stopPropagation();});
      chk.addEventListener('change',function(e){
        e.stopPropagation();
        if(chk.checked)addSubtree(id);else removeSubtree(id);
        saveSet(K.sel,selectedIds);updateAllCheckboxes();updateProgress();
      });
      td.appendChild(chk);
      var sp=document.createElement('span');sp.className='titulo-txt';sp.textContent=n.e;td.appendChild(sp);
      var icono=null;
      if(hijos.length){icono=document.createElement('span');icono.className='icono-toggle';icono.textContent=collapsedIds.has(String(id))?'▶':'▼';td.appendChild(icono);}
      card.appendChild(td);
      var contH=null;
      if(hijos.length){
        contH=document.createElement('div');
        contH.className='nodo-hijos'+(collapsedIds.has(String(id))?' collapsed':'');
        hijos.forEach(function(h){var c=construir(h);if(c)contH.appendChild(c);});
        card.appendChild(contH);
      }
      card.addEventListener('click',function(e){
        e.stopPropagation();
        if(contH&&icono){
          contH.classList.toggle('collapsed');
          var isCol=contH.classList.contains('collapsed');
          icono.textContent=isCol?'▶':'▼';
          if(isCol)collapsedIds.add(String(id));else collapsedIds.delete(String(id));
          saveSet(K.coll,collapsedIds);
        }
      });
      return card;
    }
    parsed.raices.forEach(function(r){var c=construir(r.id);if(c)cont.appendChild(c);});
    mapaDiv.appendChild(cont);
    updateProgress();
  }catch(err){
    console.error('render error:',err);
    mapaDiv.innerHTML='<div style="color:#e74c3c;padding:20px">Error: '+err.message+'</div>';
  }
}

function poblarVoces(){
  var voces=synth.getVoices().filter(function(v){return v.lang.indexOf('es')===0;});
  voiceSelect.innerHTML='';
  if(!voces.length){var o=document.createElement('option');o.textContent='(Cargando…)';voiceSelect.appendChild(o);return;}
  voces.forEach(function(v,i){var o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';voiceSelect.appendChild(o);});
  var saved=parseInt(lsGet(K.voice,'-1'));
  if(!isNaN(saved)&&saved>=0&&saved<voces.length){voiceSelect.value=saved;return;}
  var pref=-1;
  for(var j=0;j<voces.length;j++){if(voces[j].lang.toLowerCase().indexOf('es-us')===0){pref=j;break;}}
  if(pref<0)for(var k=0;k<voces.length;k++){var n=voces[k].name.toLowerCase();if(n.indexOf('sabina')!==-1||n.indexOf('paulina')!==-1||n.indexOf('monica')!==-1||n.indexOf('mónica')!==-1){pref=k;break;}}
  if(pref<0)pref=0;
  voiceSelect.value=pref;
}
if(synth.onvoiceschanged!==undefined)synth.onvoiceschanged=poblarVoces;
poblarVoces();setTimeout(poblarVoces,300);setTimeout(poblarVoces,800);setTimeout(poblarVoces,1500);
voiceSelect.addEventListener('change',function(){lsSet(K.voice,voiceSelect.value);});

function fmt(s){var m=Math.floor(s/60),g=s%60;return(m<10?'0':'')+m+':'+(g<10?'0':'')+g;}
function iniciarCrono(){if(cronoInterval)return;cronoInicioTramo=Date.now();cronoInterval=setInterval(function(){var t=Math.floor((Date.now()-cronoInicioTramo)/1000);timerDisplay.textContent=fmt(cronoSegundos+t);},250);}
function pausarCrono(){if(!cronoInterval)return;var t=Math.floor((Date.now()-cronoInicioTramo)/1000);cronoSegundos+=t;clearInterval(cronoInterval);cronoInterval=null;timerDisplay.textContent=fmt(cronoSegundos);}
function resetCrono(){if(cronoInterval){clearInterval(cronoInterval);cronoInterval=null;}cronoSegundos=0;cronoInicioTramo=0;timerDisplay.textContent='00:00';}

function limpiarTexto(t){return t.replace(/^#{1,6}\s*/gm,'').replace(/^[-*]\s*/gm,'').replace(/[*_~`>#\(\)\[\]"";]/g,' ').replace(/\n+/g,'. ').replace(/\s{2,}/g,' ').trim();}
function limpiarSynth(){generacion++;try{if(utterance){utterance.onend=null;utterance.onerror=null;utterance.onboundary=null;}if(synth.paused)synth.resume();synth.cancel();}catch(e){}}
function hablar(txt,cb){
  limpiarSynth();var miGen=generacion;
  setTimeout(function(){
    if(miGen!==generacion||estado!=='leyendo')return;
    try{
      var u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';
      var voces=synth.getVoices().filter(function(x){return x.lang.indexOf('es')===0;});
      if(voces.length){var i=parseInt(voiceSelect.value);if(isNaN(i)||i<0||i>=voces.length)i=0;u.voice=voces[i];}
      u.rate=parseFloat(lsGet(K.rate,'0.9'))||0.9;
      u.pitch=parseFloat(lsGet(K.pitch,'1'))||1;
      u.onboundary=function(ev){if(!karaokeActivo||miGen!==generacion)return;if(ev.name==='word'||ev.name==='sentence')resaltarPalabra(ev.charIndex);};
      u.onend=function(){if(miGen!==generacion||estado!=='leyendo')return;cb();};
      u.onerror=function(e){var err=e.error||'';if(err==='interrupted'||err==='canceled')return;if(miGen!==generacion)return;if(estado==='leyendo')setTimeout(function(){if(estado==='leyendo'&&miGen===generacion)cb();},200);};
      utterance=u;synth.speak(u);
    }catch(e){if(miGen===generacion)cb();}
  },200);
}
function leerSig(){
  if(estado!=='leyendo')return;
  if(indiceActual>=listaNodos.length){
    if(bucleCapturas){indiceActual=0;statusEl.textContent='🎯 Bucle cap. reiniciando…';setTimeout(leerSig,500);return;}
    if(bucleInfinito){indiceActual=0;statusEl.textContent='🔄∞ Bucle infinito reiniciando…';setTimeout(leerSig,500);return;}
    if(bucleActivo){indiceActual=0;statusEl.textContent='🔁 Bucle reiniciando…';setTimeout(leerSig,500);return;}
    estado='detenido';statusEl.textContent='Finalizado';btnPlay.textContent='▶';pausarCrono();liberarMantenimiento();return;
  }
  var txt=listaNodos[indiceActual];var lim=limpiarTexto(txt);
  if(!lim){indiceActual++;leerSig();return;}
  var p=bucleCapturas?'🎯 ':bucleInfinito?'🔄∞ ':bucleActivo?'🔁 ':'🔊 ';
  statusEl.textContent=p+'('+(indiceActual+1)+'/'+listaNodos.length+')';
  if(karaokeActivo)prepararKaraoke(txt);
  hablar(lim,function(){indiceActual++;leerSig();});
}
function detenerLectura(){
  estado='detenido';limpiarSynth();utterance=null;indiceActual=0;listaNodos=[];
  btnPlay.textContent='▶';statusEl.textContent='Detenido';resetCrono();liberarMantenimiento();
  bucleCapturas=false;kLoopCap.style.background='#8e44ad';
  bucleInfinito=false;kLoopInf.style.background='#8e44ad';
}
function togglePlayPause(){
  if(estado==='leyendo'){estado='pausado';limpiarSynth();btnPlay.textContent='▶';statusEl.textContent='⏸ Pausado';pausarCrono();return;}
  if(estado==='pausado'){estado='leyendo';btnPlay.textContent='⏸';statusEl.textContent='🔊 Reanudando…';iniciarCrono();activarMantenimiento();setTimeout(leerSig,250);return;}
  var nueva=buildReadingList();
  if(!nueva.length){statusEl.textContent='Sin contenido';return;}
  listaNodos=nueva;indiceActual=0;resetCrono();iniciarCrono();
  estado='leyendo';btnPlay.textContent='⏸';
  statusEl.textContent=selectedIds.size>0?('🔊 Leyendo selección ('+listaNodos.length+')'):'🔊 Iniciando…';
  activarMantenimiento();setTimeout(leerSig,250);
}
function prepararKaraoke(txt){
  karaokeBody.innerHTML='';
  karaokeWords=[];karaokePositions=[];karaokeCurrentIdx=-1;
  var limpio=limpiarTexto(txt);
  if(!limpio){karaokeBody.textContent='(Sin texto)';return;}
  var t=document.createElement('div');t.className='knt';t.textContent='▶ '+txt;karaokeBody.appendChild(t);
  var c=document.createElement('div');var pals=limpio.split(/\s+/),pos=0;
  for(var i=0;i<pals.length;i++){
    var w=pals[i];if(!w){pos++;continue;}
    var s=document.createElement('span');s.textContent=w;s.className='kw';c.appendChild(s);
    karaokePositions.push({start:pos,end:pos+w.length,idx:i});
    pos+=w.length+1;c.appendChild(document.createTextNode(' '));karaokeWords.push(s);
  }
  karaokeBody.appendChild(c);
}
function resaltarPalabra(ci){
  if(!karaokePositions.length)return;
  for(var i=0;i<karaokePositions.length;i++){
    var p=karaokePositions[i];
    if(ci>=p.start&&ci<p.end){
      if(karaokeCurrentIdx!==i){

async function activarMantenimiento(){

var ejemplo="# Acelerador de Conocimiento\n## ¿Qué es?\n- Herramienta para estructurar ideas jerárquicamente.\n## ¿Para qué sirve?\n- Planificar cursos, proyectos.\n## Características\n### Edición en tiempo real\n### Interactividad";

function parsear(texto){
var lineas=texto.split(/\r?\n/),nodos=[],pila=[],id=1;
for(var i=0;i<lineas.length;i++){
var linea=lineas[i].trim();if(!linea)continue;
var nivel=-1,etiqueta=linea;
if(linea.indexOf('# ')===0){nivel=0;etiqueta=linea.slice(2);}
else if(linea.indexOf('## ')===0){nivel=1;etiqueta=linea.slice(3);}
else if(linea.indexOf('### ')===0){nivel=2;etiqueta=linea.slice(4);}
else if(linea.indexOf('#### ')===0){nivel=3;etiqueta=linea.slice(5);}
else if(linea.indexOf('- ')===0||linea.indexOf('* ')===0){nivel=pila.length?pila[pila.length-1].nivel+1:1;etiqueta=linea.slice(2);}
else{nivel=pila.length?pila[pila.length-1].nivel+1:1;etiqueta=linea;}
while(pila.length&&pila[pila.length-1].nivel>=nivel)pila.pop();
var padreId=pila.length?pila[pila.length-1].id:null;
nodos.push({id:id,etiqueta:etiqueta,nivel:nivel,padreId:padreId});
pila.push({id:id,nivel:nivel});id++;
}
var hijosMap=new Map();nodos.forEach(function(n){hijosMap.set(n.id,[]);});
nodos.forEach(function(n){if(n.padreId!==null)hijosMap.get(n.padreId).push(n.id);});
return{nodos:nodos,hijosMap:hijosMap,raices:nodos.filter(function(n){return n.padreId===null;})};
}

var coincide=!term||nodo.etiqueta.toLowerCase().indexOf(term)!==-1;

card.appendChild(tituloDiv);
var contHijos=null;
if(hijos.length){contHijos=document.createElement('div');contHijos.className='nodo-hijos collapsed';hijos.forEach(function(h){var c=construir(h);if(c)contHijos.appendChild(c);});card.appendChild(contHijos);}
card.addEventListener('click',function(e){e.stopPropagation();if(contHijos&&icono){contHijos.classList.toggle('collapsed');icono.textContent=contHijos.classList.contains('collapsed')?'▶':'▼';}currentNodoId=idNodo;});
return card;
}
raices.forEach(function(r){var c=construir(r.id);if(c)contenedor.appendChild(c);});
mapaDiv.innerHTML='';mapaDiv.appendChild(contenedor);
}

function limpiarTexto(t){return t.replace(/^#{1,6}\s*/gm,'').replace(/^[-*]\s*/gm,'').replace(/[*_~`>#\(\)\[\]"";]/g,' ').replace(/\n+/g,'. ').replace(/\b\d+(\.\d+)*\.?\s*/g,' ').replace(/\s{2,}/g,' ').trim();}

function poblarVoces(){
var voces=synth.getVoices().filter(function(v){return v.lang.indexOf('es')===0;});
voiceSelect.innerHTML='';
if(!voces.length){var o=document.createElement('option');o.textContent='(Cargando...)';voiceSelect.appendChild(o);return;}

var pref=-1;
for(var j=0;j<voces.length;j++){if(voces[j].lang.toLowerCase().indexOf('es-us')===0){pref=j;break;}}
if(pref<0){for(var j=0;j<voces.length;j++){var n=voces[j].name.toLowerCase();if(n.indexOf('sabina')!==-1||n.indexOf('paulina')!==-1||n.indexOf('monica')!==-1||n.indexOf('mónica')!==-1){pref=j;break;}}}
if(pref<0){for(var j=0;j<voces.length;j++){if(voces[j].lang.toLowerCase().indexOf('es-mx')===0){pref=j;break;}}}
if(pref<0)pref=0;
voiceSelect.selectedIndex=pref;
}

function fmt(s){var m=Math.floor(s/60),g=s%60;return(m<10?'0':'')+m+':'+(g<10?'0':'')+g;}
function iniciarCronometro(){if(timerInterval)return;cronoInicioTramo=Date.now();timerInterval=setInterval(function(){var t=Math.floor((Date.now()-cronoInicioTramo)/1000);timerDisplay.textContent=fmt(cronoSegundos+t);},250);}
function pausarCronometro(){if(!timerInterval)return;var t=Math.floor((Date.now()-cronoInicioTramo)/1000);cronoSegundos+=t;clearInterval(timerInterval);timerInterval=null;timerDisplay.textContent=fmt(cronoSegundos);}
function resetCrono(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}cronoSegundos=0;cronoInicioTramo=0;timerDisplay.textContent='00:00';}
function calcularTiempoEstimado(){
var texto=obtenerTextoSeleccionado().join(' ');
var palabras=texto.trim().split(/\s+/).filter(function(x){return x;}).length;
var wpm=175;
var minutos=(palabras/wpm)*(0.9/(parseFloat(rateRange.value)||0.9));
var segundos=Math.round(minutos*60);
estimatedTime.textContent='~'+Math.floor(segundos/60)+'m '+String(segundos%60).padStart(2,'0')+'s ('+palabras+' pal.)';
}

function limpiarSynth(){generacion++;try{if(utterance){utterance.onend=null;utterance.onerror=null;utterance.onstart=null;utterance.onboundary=null;}if(synth.paused)synth.resume();synth.cancel();}catch(e){}}
function hablar(texto,onDone){
var miGen=generacion;
setTimeout(function(){
if(miGen!==generacion||estadoReproductor!=='leyendo')return;
try{
var u=new SpeechSynthesisUtterance(texto);
u.lang='es-ES';
if(!asignarVoz(u)){onDone();return;}
u.rate=parseFloat(rateRange.value)||0.9;
u.pitch=parseFloat(pitchRange.value)||1;
u.volume=1;
u.onboundary=function(ev){if(!karaokeActivo||miGen!==generacion)return;if(ev.name==='word'||ev.name==='sentence')resaltarPalabra(ev.charIndex);};
u.onend=function(){if(miGen!==generacion||estadoReproductor!=='leyendo')return;onDone();};
u.onerror=function(e){var err=e.error||'';if(err==='interrupted'||err==='canceled')return;if(miGen!==generacion)return;if(estadoReproductor==='leyendo')setTimeout(function(){if(estadoReproductor==='leyendo'&&miGen===generacion)onDone();},200);};
utterance=u;synth.speak(u);
}catch(e){if(miGen===generacion)onDone();}
},200);
}
function leerSiguienteItem(){
if(estadoReproductor!=='leyendo')return;
if(currentReadingIndex>=currentReadingList.length){
if(bucleCapturasActivo){currentReadingIndex=0;currentReadingSpan.textContent='🎯 Bucle cap. reiniciando...';setTimeout(leerSiguienteItem,500);return;}
if(bucleInfinito){currentReadingIndex=0;currentReadingSpan.textContent='🔄∞ Bucle infinito reiniciando...';setTimeout(leerSiguienteItem,500);return;}
if(isLooping){currentReadingIndex=0;currentReadingSpan.textContent='🔁 Bucle reiniciando...';setTimeout(leerSiguienteItem,500);return;}
estadoReproductor='detenido';
currentReadingSpan.textContent='Finalizado';
btnPlayPause.textContent='▶';btnPause.style.display='none';
currentReadingIndex=0;pausarCronometro();liberarMantenimiento();return;
}
var texto=currentReadingList[currentReadingIndex];
var limpio=limpiarTexto(texto);
if(!limpio){currentReadingIndex++;leerSiguienteItem();return;}
var p=bucleCapturasActivo?'🎯 ':bucleInfinito?'🔄∞ ':isLooping?'🔁 ':'🔊 ';
currentReadingSpan.textContent=p+'Leyendo ('+(currentReadingIndex+1)+'/'+currentReadingList.length+')';
if(karaokeActivo)prepararKaraoke(texto);
hablar(limpio,function(){currentReadingIndex++;leerSiguienteItem();});
}

function prepararKaraoke(txt){
karaokeBody.innerHTML='';
karaokeWords=[];karaokePositions=[];karaokeCurrentIdx=-1;
var limpio=limpiarTexto(txt);
if(!limpio){karaokeBody.textContent='(Sin texto)';return;}
var t=document.createElement('div');t.className='knt';t.textContent='▶ '+txt;karaokeBody.appendChild(t);
var c=document.createElement('div');
var pals=limpio.split(/\s+/),pos=0;
for(var i=0;i<pals.length;i++){
var w=pals[i];if(!w){pos++;continue;}
var s=document.createElement('span');s.textContent=w;s.className='kw';c.appendChild(s);
karaokePositions.push({start:pos,end:pos+w.length,idx:i});
pos+=w.length+1;
c.appendChild(document.createTextNode(' '));
karaokeWords.push(s);
}
karaokeBody.appendChild(c);
}
function resaltarPalabra(ci){
if(!karaokePositions.length)return;
for(var i=0;i<karaokePositions.length;i++){
var p=karaokePositions[i];
if(ci>=p.start&&ci<p.end){
if(karaokeCurrentIdx!==i){
if(karaokeCurrentIdx>=0&&karaokeWords[karaokeCurrentIdx])karaokeWords[karaokeCurrentIdx].classList.remove('hl');
karaokeWords[i].classList.add('hl');karaokeCurrentIdx=i;
try{karaokeWords[i].scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
}
return;
}
}
}

async function toggleRec(){
if(isRecording){try{mediaRecorder.stop();}catch(e){}return;}
if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){alert('Navegador no soporta. Usa Chrome/Edge.');return;}
try{
var stream=null;
try{stream=await navigator.mediaDevices.getDisplayMedia({audio:true,video:false});}
catch(e1){stream=await navigator.mediaDevices.getDisplayMedia({audio:true,video:true});}
if(!stream){alert('No se pudo capturar');return;}
var hasAudio=stream.getAudioTracks().length>0;
if(!hasAudio){stream.getTracks().forEach(function(t){t.stop();});alert('Marca "Compartir audio de la pestaña"');return;}
var audioStream=new MediaStream(stream.getAudioTracks());
audioChunks=[];
var mime='';
if(typeof MediaRecorder.isTypeSupported==='function'){
var tipos=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
for(var i=0;i<tipos.length;i++){if(MediaRecorder.isTypeSupported(tipos[i])){mime=tipos[i];break;}}
}
mediaRecorder=new MediaRecorder(audioStream,mime?{mimeType:mime}:{});
mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size>0)audioChunks.push(e.data);};
mediaRecorder.onstop=function(){
if(!audioChunks.length)return;
var tipo=mediaRecorder.mimeType||'audio/webm';
var ext=tipo.indexOf('mp4')!==-1?'mp4':'webm';
var blob=new Blob(audioChunks,{type:tipo});
var url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download='audio_'+Date.now()+'.'+ext;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);},1000);
isRecording=false;btnRec.innerHTML='<i class="fas fa-circle"></i>';btnRec.classList.remove('recording-dot');
};
stream.getTracks().forEach(function(t){t.onended=function(){if(isRecording)try{mediaRecorder.stop();}catch(e){}};});
mediaRecorder.start(1000);
isRecording=true;btnRec.innerHTML='<i class="fas fa-square"></i>';btnRec.classList.add('recording-dot');
}catch(err){alert('Error: '+err.message);}
}

function slugFn(s){return s.replace(/[^a-z0-9]/gi,'_').replace(/_+/g,'_').substring(0,50);}

function buildStandaloneHTML(texto,titulo){
  var el=document.getElementById('standaloneTemplate');
  var tpl=el.innerHTML;
  var jsonContent=JSON.stringify(texto).replace(/<\//g,'<\\/');
  var safeTitle=titulo.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var isDark=document.body.classList.contains('dark-theme');
  return tpl.split('__SUMMULA_CONTENT__').join(jsonContent)
            .split('__SUMMULA_TITLE__').join(safeTitle)
            .split('__SUMMULA_THEME__').join(isDark?'dark':'light');
}
