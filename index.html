<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Acelerador · Centro de Conocimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root{--bg:#f4f7fc;--surface:#fff;--text:#212529;--text-secondary:#6c757d;--header-bg:linear-gradient(135deg,#1a2a4a,#2c3e6b);--header-text:white;--border-light:#dee2e6;--editor-bg:#fafbfc;--nodo-bg:white;--nodo-hover-bg:#f8faff;--scrollbar-thumb:#c1c9d2;--modal-overlay:rgba(0,0,0,.5);--level-0-bg:#fef5e7;--level-0-border:#e67e22;--level-1-border:#3498db;--level-2-border:#2ecc71;--level-3-border:#9b59b6;--level-4-border:#e74c3c;--highlight-bg:#ffeb3b;--highlight-text:#000}
        body.dark-theme{--bg:#1e1e2e;--surface:#2a2a3c;--text:#e0e0e0;--text-secondary:#a0a0b0;--border-light:#3a3a4c;--editor-bg:#2a2a3c;--nodo-bg:#2a2a3c;--nodo-hover-bg:#35355a;--level-0-bg:#3d2e1c;--level-0-border:#f0a04b;--highlight-bg:#b8860b;--highlight-text:#fff}
        *{transition:background-color .25s,color .25s}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,system-ui,sans-serif;margin:0;min-height:100vh}
        .app-header{background:var(--header-bg);color:var(--header-text);padding:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:1050}
        .brand-wrapper{display:flex;align-items:center;gap:10px}
        .logo-img{max-height:36px;max-width:120px;object-fit:contain;border-radius:6px}
        .brand-name{font-weight:700;font-size:1.5rem;letter-spacing:-.5px}
        .subtitle{font-size:.9rem;opacity:.8}
        .toolbar-acciones{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .btn{border-radius:30px;padding:5px 14px;font-weight:500;font-size:.85rem;white-space:nowrap;cursor:pointer;background:rgba(255,255,255,.15);border:none;color:inherit}
        .btn-light{background:#f8f9fa;color:#212529}
        .btn-outline-light{background:transparent;border:1px solid rgba(255,255,255,.5);color:white}
        .btn-outline-light:hover{background:rgba(255,255,255,.2)}
        .editor-area,.mapa-area{background:var(--surface);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:16px;height:calc(100vh - 180px);display:flex;flex-direction:column;overflow:hidden;position:relative}
        .editor-area textarea{flex:1;border:none;resize:none;font-family:'Fira Code','Courier New',monospace;font-size:14px;line-height:1.7;padding:12px;background:var(--editor-bg);color:var(--text);border-radius:12px;outline:none}
        .mapa-area{overflow:hidden}
        .mapa-scroll{flex:1;overflow-y:auto}
        .mapa-scroll::-webkit-scrollbar{width:6px}
        .mapa-scroll::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}
        .card-nodo{border-left:5px solid;border-radius:12px;padding:10px 16px;margin-bottom:10px;cursor:pointer;transition:transform .15s,background .2s;box-shadow:0 1px 4px rgba(0,0,0,.04);background:var(--nodo-bg);position:relative}
        .card-nodo:hover{transform:translateX(4px);background:var(--nodo-hover-bg)}
        .level-0{border-left-color:var(--level-0-border);background:var(--level-0-bg)}
        .level-1{border-left-color:var(--level-1-border)}
        .level-2{border-left-color:var(--level-2-border)}
        .level-3{border-left-color:var(--level-3-border)}
        .level-4{border-left-color:var(--level-4-border)}
        .nodo-titulo{font-weight:600;display:flex;justify-content:space-between;align-items:center}
        .nodo-hijos{margin-left:28px;padding-left:16px;border-left:2px dashed var(--border-light);margin-top:8px}
        .collapsed{display:none}
        .icono-toggle{font-size:.9rem;opacity:.6;margin-left:12px;transition:.2s}
        .btn-fullscreen{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.1);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;color:var(--text-secondary)}
        .fullscreen-panel{position:fixed!important;top:0;left:0;width:100vw!important;height:100vh!important;z-index:2000;border-radius:0!important;padding:20px!important}
        .search-box{display:flex;align-items:center;background:var(--surface);border-radius:20px;padding:4px 8px;border:1px solid var(--border-light);margin-bottom:8px;gap:4px}
        .search-box input{border:none;background:transparent;outline:none;width:100%;padding:4px 8px;color:var(--text)}
        .reader-panel{background:var(--surface);border-radius:12px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border-light)}
        .dropdown{position:relative;display:inline-block}
        .dropdown-menu{display:none;position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;min-width:220px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:1000;padding:8px 0}
        .dropdown-menu.show{display:block}
        .dropdown-item{display:block;padding:8px 16px;color:var(--text);text-decoration:none;cursor:pointer;white-space:nowrap}
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-overlay);z-index:3000;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal-content{background:var(--surface);border-radius:16px;max-width:500px;width:90%;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
        select.form-select,input.form-control{background:var(--surface);color:var(--text);border:1px solid var(--border-light);border-radius:20px}
        .node-select{margin-right:8px;transform:scale(1.2);cursor:pointer}
        .highlight-word{background:var(--highlight-bg);color:var(--highlight-text);border-radius:3px;font-weight:bold}
        .btn-sumula-accion{background:#ffcd3c;color:#212529;border:none;border-radius:30px;padding:5px 14px;font-weight:700;cursor:pointer;margin-top:10px}
        .recording-dot{color:red;animation:blink 1s infinite}
        @keyframes blink{50%{opacity:0}}
        .timer-display{font-family:monospace;font-weight:bold;font-size:.9rem}
        .speed-pitch{display:flex;flex-direction:column;gap:2px}
        .speed-pitch label{font-size:.7rem;color:var(--text-secondary)}
    </style>
</head>
<body>
    <div class="app-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-5">
                    <div class="brand-wrapper">
                        <img id="logoImg" class="logo-img" src="" alt="Logo" style="display:none;">
                        <i id="defaultBrain" class="fas fa-brain fa-2x" style="color:#ffcd3c;"></i>
                        <div>
                            <div class="brand-name">Nexus <span style="color:#ffcd3c;">Acelerador</span></div>
                            <div class="subtitle" id="tituloDinamico">Centro de Conocimiento</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-7 toolbar-acciones justify-content-end mt-2 mt-md-0">
                    <button class="btn btn-outline-light" id="btnSumula">SÚMULA</button>
                    <button class="btn btn-outline-light" id="btnCorolario">Corolario</button>
                    <button class="btn btn-outline-light" id="btnConfig"><i class="fas fa-cog"></i></button>
                    <button class="btn btn-outline-light" id="btnAPA"><i class="fas fa-id-card"></i> APA</button>
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" id="dropdownBtn">Acciones</button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a class="dropdown-item" id="exportarHtml"><i class="fas fa-file-code me-2"></i>Exportar HTML</a>
                            <a class="dropdown-item" id="vistaPreviaHtml"><i class="fas fa-eye me-2"></i>Vista previa HTML</a>
                            <a class="dropdown-item" id="exportarTree"><i class="fas fa-tree me-2"></i>Exportar Árbol TXT</a>
                            <a class="dropdown-item" id="exportarTxt"><i class="fas fa-file-alt me-2"></i>Exportar TXT Raw</a>
                            <a class="dropdown-item" id="exportarMd"><i class="fab fa-markdown me-2"></i>Exportar Markdown</a>
                            <a class="dropdown-item" id="exportarTxtEnriquecido"><i class="fas fa-book-open me-2"></i>Exportar TXT Enriquecido</a>
                        </div>
                    </div>
                    <button class="btn btn-light" id="expandirTodo"><i class="fas fa-expand-alt"></i></button>
                    <button class="btn btn-light" id="colapsarTodo"><i class="fas fa-compress-alt"></i></button>
                    <button class="btn btn-light" id="btnUndo"><i class="fas fa-undo"></i></button>
                    <button class="btn btn-light" id="btnRedo"><i class="fas fa-redo"></i></button>
                    <button class="btn btn-outline-light" id="btnTheme"><i class="fas fa-moon"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-3">
        <div class="row g-3">
            <div class="col-lg-6" id="panelEditor">
                <div class="editor-area">
                    <button class="btn-fullscreen" data-target="panelEditor"><i class="fas fa-expand"></i></button>
                    <textarea id="contenido" spellcheck="false"></textarea>
                </div>
            </div>
            <div class="col-lg-6" id="panelMapa">
                <div class="mapa-area">
                    <button class="btn-fullscreen" data-target="panelMapa"><i class="fas fa-expand"></i></button>
                    <div class="search-box">
                        <i class="fas fa-search text-secondary"></i>
                        <input type="text" id="searchInput" placeholder="Buscar en mapa...">
                        <button id="clearSearch" style="border:none;background:transparent;cursor:pointer;"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="reader-panel" id="readerPanel">
                        <button class="btn btn-sm btn-primary" id="btnPlayPause" title="Reproducir/Pausar">▶</button>
                        <button class="btn btn-sm btn-warning" id="btnPause" title="Pausar" style="display:none;">⏸</button>
                        <button class="btn btn-sm btn-secondary" id="btnStop" title="Detener">⏹</button>
                        <button class="btn btn-sm btn-warning" id="btnLoop" title="Repetir en bucle">🔁</button>
                        <button class="btn btn-sm btn-danger" id="btnRec" title="Grabar"><i class="fas fa-circle"></i></button>
                        <button class="btn btn-sm btn-info" id="btnTimer" title="Cronómetro">⏱</button>
                        <div class="speed-pitch"><label>Velocidad</label><input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="0.9"></div>
                        <div class="speed-pitch"><label>Tono</label><input type="range" id="pitchRange" min="0.5" max="1.5" step="0.1" value="1"></div>
                        <select class="form-select form-select-sm" id="voiceSelect" style="width:auto;"></select>
                        <span id="currentReading" class="text-muted small">Listo</span>
                        <span id="timerDisplay" class="timer-display">00:00</span>
                        <span id="estimatedTime" class="text-muted small"></span>
                    </div>
                    <div class="mapa-scroll" id="mapaScroll"><div id="mapa"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="sumulaModal">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h5 style="margin:0;">Importar a SÚMULA</h5><button id="closeSumulaModal" style="border:none;background:none;font-size:1.4rem;cursor:pointer;">&times;</button></div>
            <div class="mb-3"><label>Archivo (PDF, DOCX, TXT, HTML)</label><input type="file" class="form-control" id="fileSumulaInput" accept=".pdf,.docx,.txt,.html,.htm"></div>
            <div class="text-center my-2">- O -</div>
            <div class="mb-3"><label>Pegar texto</label><textarea class="form-control" id="pastedTextSumula" rows="4"></textarea></div>
            <div style="display:flex;justify-content:space-between;"><button class="btn btn-secondary" id="cancelSumula">Cancelar</button><button class="btn-sumula-accion" id="processSumula">Procesar</button></div>
            <div id="sumulaLoading" style="text-align:center;margin-top:8px;display:none;"><i class="fas fa-spinner fa-spin"></i> Procesando...</div>
        </div>
    </div>

    <div class="modal-overlay" id="configModal">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h5 style="margin:0;">Configuración</h5><button class="btn-close" id="closeConfigModal" style="border:none;background:none;font-size:1.4rem;cursor:pointer;">&times;</button></div>
            <div class="mb-3"><label>Logo</label><input type="text" class="form-control" id="logoFilename"></div>
            <button class="btn btn-primary" id="saveConfig">Guardar</button>
        </div>
    </div>

    <div class="modal-overlay" id="apaModal">
        <div class="modal-content">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h5 style="margin:0;">Datos APA</h5><button class="btn-close" id="closeApaModal" style="border:none;background:none;font-size:1.4rem;cursor:pointer;">&times;</button></div>
            <div class="mb-3"><label>Autor</label><input type="text" class="form-control" id="apaAuthor"></div>
            <div class="mb-3"><label>Título</label><input type="text" class="form-control" id="apaTitle"></div>
            <div class="mb-3"><label>Institución</label><input type="text" class="form-control" id="apaInstitution"></div>
            <div class="mb-3"><label>Fecha</label><input type="date" class="form-control" id="apaDate"></div>
            <button class="btn btn-primary w-100" id="saveAPA">Guardar</button>
        </div>
    </div>

    <div class="footer" style="text-align:center;padding:8px;font-size:.8rem;color:var(--text-secondary);">
        <i class="fas fa-bolt text-warning"></i> Acelera tus ideas
    </div>

    <template id="standaloneTemplate">
<!DOCTYPE html>

<head>

<style>

<h1>__SUMMULA_TITLE__</h1>
<div class="toolbar">
<button class="btn-play" id="btnPlay">▶</button>
<button class="btn-pause" id="btnPause" style="display:none">⏸</button>
<button class="btn-stop" id="btnStop">⏹</button>
<button class="btn-loop" id="btnLoop">🔁</button>

<span class="status" id="status">Listo</span>
</div>
<div class="toolbar">
<button class="btn-light" id="btnExpandir">Expandir Todo</button>
<button class="btn-light" id="btnColapsar">Colapsar Todo</button>
<button class="btn-light" id="btnTheme">🌙 Modo Oscuro</button>
</div>

<input type="text" id="searchInput" placeholder="Buscar...">
<button id="clearSearch">✕</button>
</div>
<div id="mapa"></div>
<script>
var raw = __SUMMULA_CONTENT__;
(function(){
var synth = window.speechSynthesis;
var utterance = null;
var listaNodos = [];
var indiceActual = 0;
var bloqueado = false;
var estado = 'detenido';
var bucleActivo = false;
var cronoInterval = null;
var cronoSegundos = 0;
var cronoInicioTramo = 0;
var generacion = 0;

var btnPlay = document.getElementById('btnPlay');
var btnPause = document.getElementById('btnPause');
var btnStop = document.getElementById('btnStop');
var btnLoop = document.getElementById('btnLoop');
var voiceSelect = document.getElementById('voiceSelect');
var statusEl = document.getElementById('status');
var timerDisplay = document.getElementById('timerDisplay');
var mapaDiv = document.getElementById('mapa');

function parsear(t){
var l = t.split(/\r?\n/), n = [], s = [], id = 1;
for (var i = 0; i < l.length; i++) {
var a = l[i].trim();
if (!a) continue;
var v = -1, e = a;
if (a.indexOf('# ') === 0) { v = 0; e = a.slice(2); }
else if (a.indexOf('## ') === 0) { v = 1; e = a.slice(3); }
else if (a.indexOf('### ') === 0) { v = 2; e = a.slice(4); }
else if (a.indexOf('#### ') === 0) { v = 3; e = a.slice(5); }
else if (a.indexOf('- ') === 0 || a.indexOf('* ') === 0) { v = s.length ? s[s.length-1].v + 1 : 1; e = a.slice(2); }
else { v = s.length ? s[s.length-1].v + 1 : 1; e = a; }
while (s.length && s[s.length-1].v >= v) s.pop();
var pid = s.length ? s[s.length-1].id : null;
n.push({id:id, e:e, v:v, p:pid});
s.push({id:id, v:v});
id++;
}
var hm = new Map();
n.forEach(function(x){ hm.set(x.id, []); });
n.forEach(function(x){ if (x.p !== null) hm.get(x.p).push(x.id); });
return {n:n, hm:hm, r:n.filter(function(x){ return x.p === null; })};
}

function limpiarTexto(t){
return t.replace(/^#{1,6}\s*/gm, '')
.replace(/^[-*]\s*/gm, '')
.replace(/[*_~`>#\(\)\[\]"";]/g, ' ')
.replace(/\n+/g, '. ')
.replace(/\s{2,}/g, ' ')
.trim();
}

function render(){
var res = parsear(raw);
var nm = new Map();
res.n.forEach(function(x){ nm.set(x.id, x); });
mapaDiv.innerHTML = '';
if (!res.r.length) {
mapaDiv.innerHTML = '<div style="color:#999;text-align:center;padding:40px">Sin contenido</div>';
return;
}
function construir(id){
var x = nm.get(id);
if (!x) return null;
var hijos = res.hm.get(id) || [];
var d = document.createElement('div');
d.className = 'card-nodo level-' + Math.min(x.v, 4);
var td = document.createElement('div');
td.className = 'nodo-titulo';
var sp = document.createElement('span');
sp.textContent = x.e;
sp.setAttribute('data-id', id);
td.appendChild(sp);
if (hijos.length) {
var ic = document.createElement('span');
ic.className = 'icono-toggle';
ic.textContent = '▶';
td.appendChild(ic);
}
d.appendChild(td);
if (hijos.length) {
var ch = document.createElement('div');
ch.className = 'nodo-hijos collapsed';
hijos.forEach(function(y){
var z = construir(y);
if (z) ch.appendChild(z);
});
d.appendChild(ch);
d.addEventListener('click', function(e){
e.stopPropagation();
ch.classList.toggle('collapsed');
ic.textContent = ch.classList.contains('collapsed') ? '▶' : '▼';
listaNodos = [];
function rec(idN){
var nn = nm.get(idN);
if (!nn) return;
listaNodos.push(nn.e);
(res.hm.get(idN) || []).forEach(rec);
}
rec(id);

        clearSearchBtn.addEventListener('click',function(){searchInput.value='';generarMapa();});
        document.getElementById('expandirTodo').addEventListener('click',function(){document.querySelectorAll('.nodo-hijos').forEach(function(c){c.classList.remove('collapsed');});document.querySelectorAll('.icono-toggle').forEach(function(i){i.textContent='▼';});});
        document.getElementById('colapsarTodo').addEventListener('click',function(){document.querySelectorAll('.nodo-hijos').forEach(function(c){c.classList.add('collapsed');});document.querySelectorAll('.icono-toggle').forEach(function(i){i.textContent='▶';});});
        document.querySelectorAll('.btn-fullscreen').forEach(function(btn){btn.addEventListener('click',function(){var p=document.getElementById(btn.dataset.target);p.classList.toggle('fullscreen-panel');var otro=p.id==='panelEditor'?'panelMapa':'panelEditor';document.getElementById(otro).style.display=p.classList.contains('fullscreen-panel')?'none':'';});});
        document.getElementById('btnUndo').addEventListener('click',undo);
        document.getElementById('btnRedo').addEventListener('click',redo);
        document.getElementById('btnTheme').addEventListener('click',function(){localStorage.setItem(STORAGE_THEME,document.body.classList.contains('dark-theme')?'light':'dark');aplicarTema();});

        btnPlayPause.addEventListener('click',togglePlayPause);
        btnPause.addEventListener('click',function(){synth.pause();btnPause.style.display='none';btnPlayPause.textContent='▶';currentReadingSpan.textContent='Pausado';});
        btnStop.addEventListener('click',stopReading);
        btnLoop.addEventListener('click',function(){isLooping=!isLooping;btnLoop.textContent=isLooping?'🔁✅':'🔁';if(isLooping&&!synth.speaking)togglePlayPause();});
        btnRec.addEventListener('click',toggleRec);
        btnTimer.addEventListener('click',function(){if(timerInterval){detenerCronometro();timerDisplay.textContent='00:00';}else iniciarCronometro();});
        rateRange.addEventListener('input',calcularTiempoEstimado);

        // Dropdown
        document.getElementById('dropdownBtn').addEventListener('click',function(e){e.stopPropagation();document.getElementById('dropdownMenu').classList.toggle('show');});
        document.addEventListener('click',function(){document.getElementById('dropdownMenu').classList.remove('show');});

        // Modales
        document.getElementById('btnConfig').addEventListener('click',function(){document.getElementById('logoFilename').value=localStorage.getItem(STORAGE_LOGO)||'';document.getElementById('configModal').classList.add('show');});
        document.getElementById('closeConfigModal').addEventListener('click',function(){document.getElementById('configModal').classList.remove('show');});
        document.getElementById('saveConfig').addEventListener('click',function(){localStorage.setItem(STORAGE_LOGO,document.getElementById('logoFilename').value);aplicarLogo();document.getElementById('configModal').classList.remove('show');});
        document.getElementById('btnAPA').addEventListener('click',function(){document.getElementById('apaModal').classList.add('show');});
        document.getElementById('closeApaModal').addEventListener('click',function(){document.getElementById('apaModal').classList.remove('show');});
        document.getElementById('saveAPA').addEventListener('click',function(){document.getElementById('apaModal').classList.remove('show');});

        var sumulaModal=document.getElementById('sumulaModal');
        document.getElementById('btnSumula').addEventListener('click',function(){sumulaModal.classList.add('show');});
        document.getElementById('closeSumulaModal').addEventListener('click',function(){sumulaModal.classList.remove('show');});
        document.getElementById('cancelSumula').addEventListener('click',function(){sumulaModal.classList.remove('show');});
        document.getElementById('processSumula').addEventListener('click',async function(){
            document.getElementById('sumulaLoading').style.display='block';
            try{
                var textToConvert='';
                var file=document.getElementById('fileSumulaInput').files[0];
                var pasted=document.getElementById('pastedTextSumula').value;
                if(file){
                    var type=file.name.split('.').pop().toLowerCase();
                    if(type==='pdf'){var arr=await file.arrayBuffer();var pdf=await pdfjsLib.getDocument({data:arr}).promise;var txt='';for(var i=1;i<=pdf.numPages;i++){var page=await pdf.getPage(i);var tc=await page.getTextContent();txt+=tc.items.map(function(x){return x.str;}).join(' ')+'\n';}textToConvert=txt;}
                    else if(type==='docx'){var arr2=await file.arrayBuffer();var res=await mammoth.extractRawText({arrayBuffer:arr2});textToConvert=res.value;}
                    else{textToConvert=await file.text();}
                }else if(pasted.trim()){textToConvert=pasted;}
                else{alert('Sube archivo o pega texto');return;}
                var resultado='# Documento Importado\n## ¿Qué es?\n- Contenido importado.\n## ¿Para qué sirve?\n- Material de trabajo.\n## Características\n';
                textToConvert.split('\n').forEach(function(l){l=l.trim();if(l)resultado+='- '+l+'\n';});
                textarea.value=resultado;pushHistorial();generarMapa();
                sumulaModal.classList.remove('show');
            }catch(e){console.error(e);alert('Error: '+e.message);}
            finally{document.getElementById('sumulaLoading').style.display='none';}
        });

        document.getElementById('btnCorolario').addEventListener('click',function(){
            if(confirm("¿Cargar Corolario de ejemplo?")){
                textarea.value="# Corolario Pedagógico\n## ¿Qué es?\n- Síntesis didáctica.\n## ¿Para qué sirve?\n- Guía práctica.\n## Características\n### La Fundación\n#### Detalles\n- Sin un Maestro Perfecto es imposible recibir el Naam.\n##### Ejemplos\n- \"El Maestro es quien tiene que dar.\"\n###### Conclusión del tema\n- El conocimiento viene de la Gracia.";
                pushHistorial();guardarContenido();generarMapa();
            }
        });

        function descargarArchivo(blob,nombre){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}
        function slug(s){return s.replace(/[^a-z0-9]/gi,'_').replace(/_+/g,'_').substring(0,50);}
        function obtenerTitulo(){return tituloDin.textContent||'Documento';}

        // ==========================================
        // CONSTRUIR HTML EXPORTADO (con TODOS los comandos)
        // ==========================================
        function buildStandaloneHTML(texto, titulo){
            var tpl = document.getElementById('standaloneTemplate').innerHTML;
            var jsonContent = JSON.stringify(texto).replace(/<\//g, '<\\/');
            var safeTitle = titulo.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            var result = tpl.split('__SUMMULA_CONTENT__').join(jsonContent)
                            .split('__SUMMULA_TITLE__').join(safeTitle);
            return result;
        }

        // ==========================================
        // EXPORTAR HTML
        // ==========================================
        document.getElementById('exportarHtml').addEventListener('click',function(){
            var texto=textarea.value;
            if(!texto.trim()){alert('No hay contenido');return;}
            var titulo=obtenerTitulo();
            var html=buildStandaloneHTML(texto,titulo);
            descargarArchivo(new Blob([html],{type:'text/html;charset=utf-8'}),slug(titulo)+'.html');
            currentReadingSpan.textContent='✅ HTML exportado con comandos';
        });

        // ==========================================
        // VISTA PREVIA HTML (abre en nueva pestaña)
        // ==========================================
        document.getElementById('vistaPreviaHtml').addEventListener('click',function(){
            var texto=textarea.value;
            if(!texto.trim()){alert('No hay contenido para previsualizar');return;}
            var titulo=obtenerTitulo();
            var html=buildStandaloneHTML(texto,titulo);
            var w=window.open('','_blank');
            if(!w){alert('⚠️ Activa las ventanas emergentes para este sitio');return;}
            w.document.open();
            w.document.write(html);
            w.document.close();
            currentReadingSpan.textContent='👁 Vista previa abierta';
        });

        // EXPORTACIONES SIMPLES
        document.getElementById('exportarTxt').addEventListener('click',function(){descargarArchivo(new Blob([textarea.value],{type:'text/plain'}),slug(obtenerTitulo())+'.txt');});
        document.getElementById('exportarMd').addEventListener('click',function(){descargarArchivo(new Blob([textarea.value],{type:'text/markdown'}),slug(obtenerTitulo())+'.md');});
        document.getElementById('exportarTree').addEventListener('click',function(){
            var r=parsear(textarea.value),nm=new Map(r.nodos.map(function(n){return[n.id,n];}));
            var l=['ÁRBOL — '+obtenerTitulo(),'',''];
            function a(id,p,u){var n=nm.get(id);l.push(p+(u?'└── ':'├── ')+n.etiqueta);var h=r.hijosMap.get(id)||[];h.forEach(function(x,i){a(x,p+(u?'    ':'│   '),i===h.length-1)});}
            r.raices.forEach(function(x,i){a(x.id,'',i===r.raices.length-1)});
            descargarArchivo(new Blob([l.join('\n')],{type:'text/plain'}),slug(obtenerTitulo())+'_arbol.txt');
        });
        document.getElementById('exportarTxtEnriquecido').addEventListener('click',function(){
            var r=parsear(textarea.value),nm=new Map(r.nodos.map(function(n){return[n.id,n];}));
            var l=['═══════════════════','  '+obtenerTitulo().toUpperCase(),'═══════════════════',''];
            function g(id,niv){var n=nm.get(id),h=r.hijosMap.get(id)||[];var e=n.etiqueta.replace(/^#{1,6}\s*/,'');
                if(niv===0){l.push('','════════','  '+e.toUpperCase(),'════════','');}
                else if(niv===1){l.push('','▶ '+e,'────','');}
                else if(niv===2){l.push('  ◆ '+e);}
                else l.push('      • '+e);
                h.forEach(function(x){g(x,niv+1)});}
            r.raices.forEach(function(x){g(x.id,0)});
            descargarArchivo(new Blob([l.join('\n')],{type:'text/plain'}),slug(obtenerTitulo())+'_enriq.txt');
        });

        // INICIALIZACIÓN
        aplicarTema();aplicarLogo();pushHistorial();generarMapa();
        setInterval(function(){if(textarea.value!==historial[historialPos]){pushHistorial();guardarContenido();}},2000);
    })();
    </script>
</body>
